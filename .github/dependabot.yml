# Weekly bumps for SHA-pinned GitHub Actions (with their `# vX.Y.Z` comments) and npm devDependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
